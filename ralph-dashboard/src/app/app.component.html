<ion-app>
  <a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to main content</a>
  <ion-header [translucent]="false" class="app-header">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button menu="workspace-menu"></ion-menu-button>
      </ion-buttons>
      <ion-title class="app-title">{{ headerTitle() }}</ion-title>
      <app-workspace-switcher slot="end"></app-workspace-switcher>
      <ion-buttons slot="end">
        <ion-button
          class="toolbar-insights"
          (click)="navigateToInsights()"
          fill="clear"
          aria-label="Insights"
          [class.active-section]="nav.activeSection() === 'insights'"
          title="Insights: tokens and tool calls"
        >
          <ion-icon slot="icon-only" name="stats-chart-outline"></ion-icon>
        </ion-button>
        <ion-button (click)="refresh()" fill="clear" aria-label="Refresh">
          <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
        </ion-button>
        <ion-button (click)="toggleTheme()" fill="clear" aria-label="Toggle theme">
          <ion-icon slot="icon-only" [name]="isLightTheme() ? 'moon-outline' : 'sunny-outline'"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-split-pane contentId="main-content">
    <ion-menu menuId="workspace-menu" contentId="main-content" side="start" class="app-menu">
      <ion-content [forceOverscroll]="false">
        <app-workspace-sidebar></app-workspace-sidebar>
      </ion-content>
    </ion-menu>

    <div class="ion-page main-shell" id="main-content" tabindex="-1">
      <ion-content class="main-content" [forceOverscroll]="false">
        <div class="content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </ion-content>
    </div>
  </ion-split-pane>
  <ralph-assistant-dock></ralph-assistant-dock>
</ion-app>
