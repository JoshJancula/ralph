<div class="log-viewer-container">
  <header class="toolbar">
    <div class="toolbar-main">
      <div class="search-bar">
        <input
          type="search"
          class="search-input log-search"
          [value]="searchQuery"
          (input)="handleSearchInput($any($event.target).value ?? '')"
          placeholder="Search this log..."
          aria-label="Search this log"
        />
        <span class="match-count" *ngIf="searchQuery && matchLineIndices.length > 0">
          {{ matchCount }}
        </span>
        <button
          *ngIf="searchQuery && matchLineIndices.length > 0"
          (click)="prevMatch()"
          class="nav-btn"
          type="button"
          title="Previous match"
          aria-label="Previous match"
        >&#8593;</button>
        <button
          *ngIf="searchQuery && matchLineIndices.length > 0"
          (click)="nextMatch()"
          class="nav-btn"
          type="button"
          title="Next match"
          aria-label="Next match"
        >&#8595;</button>
      </div>
      <div class="actions" aria-label="Log viewer actions">
      <button
        *ngIf="root === 'logs' && planDirectory"
        (click)="viewPlanFile()"
        class="action-btn action-btn--primary"
      >
        View Plan
      </button>
      <button
        (click)="togglePrettyMode()"
        type="button"
        class="action-btn"
      >
        {{ prettyMode ? 'Raw' : 'Pretty' }}
      </button>
      <button
        (click)="startTailing()"
        [disabled]="isTailing"
        class="action-btn"
      >
        Start tailing
      </button>
      <button
        (click)="stopTailing()"
        [disabled]="!isTailing"
        class="action-btn"
      >
        Stop tailing
      </button>
      <button
        (click)="goToLatest()"
        class="action-btn"
      >
        Go to latest
      </button>
      <ion-badge *ngIf="isTailing">Tailing active</ion-badge>
      </div>
    </div>
  </header>

  <div *ngIf="isLoading" class="loading-state">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="error" class="error-message" role="alert">
    <ralph-error-modal class="is-embedded" [error]="error" [embedded]="true" [showHeader]="false" />
  </div>

  <div *ngIf="!isLoading && !error" class="log-body">
    <div
      *ngIf="prettyMode"
      class="log-pretty markdown-content"
      [innerHTML]="filteredPrettyHtml"
      #prettyContent
      (scroll)="onScroll()"
    ></div>
    <pre
      *ngIf="!prettyMode"
      (scroll)="onScroll()"
      #logContent
      class="log-content"
    >
      <ng-container *ngFor="let line of filteredLines; trackBy: trackByLine; let i = index">
        <span [id]="'log-line-' + i" [innerHTML]="line"></span>
        <br />
      </ng-container>
    </pre>

    <div *ngIf="isTailing && waitingForOutput" class="waiting-indicator">
      <ion-spinner name="dots"></ion-spinner>
      <span class="waiting-text">Waiting for output...</span>
    </div>
  </div>
</div>
