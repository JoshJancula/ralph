<div class="file-viewer">
  <div class="file-toolbar" *ngIf="showViewLogs || runSnippet || isMarkdown()">
    <div class="toolbar-left">
      <ion-button *ngIf="showViewLogs" fill="clear" size="small" (click)="viewLogs()">
        View Logs
      </ion-button>
      <ion-button *ngIf="isMarkdown()" fill="clear" size="small" (click)="toggleView()">
        {{ isRendered() ? 'View Raw' : 'View Pretty' }}
      </ion-button>
    </div>
    <div class="toolbar-right" *ngIf="runSnippet">
      <span class="snippet-label">Run: </span>
      <code class="snippet-code">{{ runSnippet }}</code>
    </div>
  </div>

  <div class="loading-indicator" *ngIf="loading()">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="error-panel" *ngIf="!loading() && error() as err">
    <ralph-error-modal
      class="is-embedded"
      [error]="err"
      [embedded]="true"
      [showHeader]="false"
    />
    <div class="error-actions" *ngIf="err.suggestedActions && err.suggestedActions.length > 0">
      <ion-button fill="solid" (click)="performErrorAction('RETRY')" *ngIf="err.suggestedActions.includes('RETRY')">
        Retry
      </ion-button>
      <ion-button fill="solid" (click)="performErrorAction('REFRESH_INDEX')" *ngIf="err.suggestedActions.includes('REFRESH_INDEX')">
        Refresh Index
      </ion-button>
      <ion-button fill="solid" (click)="performErrorAction('RETURN_TO_PLANS')" *ngIf="err.suggestedActions.includes('RETURN_TO_PLANS')">
        Return to Plans
      </ion-button>
      <ion-button fill="solid" (click)="performErrorAction('SELECT_PROJECT')" *ngIf="err.suggestedActions.includes('SELECT_PROJECT')">
        Select Project
      </ion-button>
    </div>
  </div>

  <div class="file-content" *ngIf="!loading() && !error()">
    <div class="file-inner">
      <ng-container *ngIf="isMarkdown(); else notMarkdown">
        <div *ngIf="isRendered(); else markdownSource" class="markdown-content" [innerHTML]="safeHtml()" (click)="handleContentClick($event)"></div>
        <ng-template #markdownSource>
          <pre class="text-content">{{ content() }}</pre>
        </ng-template>
      </ng-container>

      <ng-template #notMarkdown>
        <div *ngIf="fileRole() as role" class="role-view" [attr.data-testid]="'role-view-' + role">
          <p class="role-label">{{ fileRoleLabel() }}</p>
          <dl>
            <ng-container *ngFor="let row of roleViewRows()">
              <dt>{{ row.label }}</dt>
              <dd>{{ row.value }}</dd>
            </ng-container>
          </dl>
        </div>

        <div *ngIf="isJson() && !fileRole()">
          <pre class="json-content">{{ formatJson() }}</pre>
        </div>

        <div *ngIf="isPlainText()">
          <pre class="text-content">{{ content() }}</pre>
        </div>
      </ng-template>
    </div>
  </div>
</div>
