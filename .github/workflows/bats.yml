name: Bats tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  bats:
    name: Run Bats harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0

      - name: Install GNU parallel
        run: sudo apt-get update && sudo apt-get install -y parallel

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Python unit tests
        run: bash scripts/run-python-unit-tests.sh

      - name: Run Bats suite
        run: bash scripts/run-bats.sh -j 4
