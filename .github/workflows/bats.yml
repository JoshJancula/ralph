name: Bats tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  schedule:
    # Nightly, so the acceptance tier still runs regularly without charging
    # every pull request for it.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs waste the most expensive resource here. A new push to a PR
# cancels the in-flight run for that ref instead of letting a multi-job suite
# burn to completion against a commit nobody will merge. main is never
# cancelled, so pushes to it always produce a complete result.
concurrency:
  group: bats-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bats-fast:
    name: Bats fast tier
    runs-on: ubuntu-24.04
    # The fast tier is 210 of 271 files and about 13% of measured suite cost.
    # It should land in well under 25 minutes; if it does not, something
    # regressed or hung and the job should die rather than bill for the
    # 360-minute default.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned OpenCode plugin declaration
        # The plugin generator refuses to render the OpenCode adapter without
        # the pinned @opencode-ai/plugin type declaration -- that pin is the
        # supply-chain check. It lives in gitignored node_modules, so CI has to
        # install it or the check silently degrades into a skip.
        run: npm install --prefix bundle/.opencode --no-audit --no-fund

      - name: Install GNU parallel and ripgrep
        run: sudo apt-get update && sudo apt-get install -y parallel ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Bats fast tier
        run: CI=1 bash scripts/run-bats.sh --tier fast -j 4

      - name: Recheck resource-sensitive Bats tests serially
        # These tests fork many short-lived jq/flock/awk/mktemp subprocesses per
        # invocation. On a loaded runner right after the -j 4 suite, a single
        # transient subprocess failure makes the native-hook fail-open (empty
        # output) or drops a dedupe cache write, producing a spurious red. They
        # pass deterministically in isolation, so retry the whole serial batch a
        # few times and only fail the job if every attempt fails. This retries
        # transient flake; it does not skip or weaken the assertions.
        env:
          CI: '1'
          RALPH_CI_SERIAL_RECHECK: '1'
        run: |
          set -uo pipefail
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::serial recheck attempt ${attempt}/${attempts}"
            # Recreate the small shared fixture set before each attempt. The
            # parallel suite may legitimately update fixture state, and a
            # retry must start from the same clean inputs rather than replaying
            # against a failed attempt's leftovers.
            bash scripts/setup-test-fixtures.sh
            if bash scripts/run-bats.sh -j 1 -- \
              --print-output-on-failure \
              tests/bats/mcp-proxy/mcp-proxy-grep-source-cap-dedupe.bats \
              tests/bats/native-hook/bash-compact-delivered-metrics.bats \
              tests/bats/native-hook/fail-open-instrumentation.bats \
              tests/bats/native-hook/native-result-shapes.bats; then
              echo "::endgroup::"
              echo "serial recheck passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "serial recheck attempt ${attempt} failed"
          done
          echo "serial recheck failed after ${attempts} attempts" >&2
          exit 1

  bats-slow:
    name: Bats slow tier
    runs-on: ubuntu-24.04
    # 53 files carrying most of the remaining suite cost -- graph scheduler
    # runs and run-plan end-to-end paths. Each boots the real
    # orchestrator/run-plan stack per node, so these are fork-bound rather than
    # CPU-bound: the suite uses only ~36% of available cores regardless of -j.
    #
    # -j was briefly dropped to 2 on the theory that a high load average meant
    # contention was costing throughput. Measurement says otherwise: -j 4
    # reached ~475 tests in 27 minutes, -j 2 reached ~489 in 42 minutes
    # (roughly 17.6 vs 11.6 tests/min). The high load average is a symptom of
    # deep process trees, not a throughput ceiling. Staying at 4.
    #
    # Measured: 93m09s locally at -j 4 for 1049 tests. The earlier 90-minute
    # cap was an estimate and would have killed a legitimate run. 150 leaves
    # headroom for a slower 4-core runner while still bounding a hang well
    # below the 360-minute default.
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned OpenCode plugin declaration
        # The plugin generator refuses to render the OpenCode adapter without
        # the pinned @opencode-ai/plugin type declaration -- that pin is the
        # supply-chain check. It lives in gitignored node_modules, so CI has to
        # install it or the check silently degrades into a skip.
        run: npm install --prefix bundle/.opencode --no-audit --no-fund

      - name: Install GNU parallel and ripgrep
        run: sudo apt-get update && sudo apt-get install -y parallel ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Bats slow tier
        run: CI=1 bash scripts/run-bats.sh --tier slow -j 4

  bats-acceptance:
    name: Bats acceptance tier
    runs-on: ubuntu-24.04
    # Seven files, 38 tests: heavy end-to-end replays that are real coverage but
    # do not belong on the critical path of every pull request. Runs on main,
    # nightly, and on demand.
    #
    # Measured at 13m35s locally (-j 2, 38 tests, green). The 45-minute cap is
    # roughly 3x that, to absorb a slower 4-core runner while still killing a
    # genuine hang long before the 360-minute default would. -j 2 is simply the
    # setting this was measured at; it has not been compared against -j 4 here,
    # and on the slow tier a higher -j measured faster.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned OpenCode plugin declaration
        # The plugin generator refuses to render the OpenCode adapter without
        # the pinned @opencode-ai/plugin type declaration -- that pin is the
        # supply-chain check. It lives in gitignored node_modules, so CI has to
        # install it or the check silently degrades into a skip.
        run: npm install --prefix bundle/.opencode --no-audit --no-fund

      - name: Install GNU parallel and ripgrep
        run: sudo apt-get update && sudo apt-get install -y parallel ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Bats acceptance tier
        run: CI=1 bash scripts/run-bats.sh --tier acceptance -j 2

  graph-shard-manifest:
    name: Graph shard manifest
    runs-on: ubuntu-24.04
    # Cheap guard: fails if any tests/bats/graph file is in no shard and not
    # excluded, which is how four files (including the tooling-profile tests)
    # went unrun. Listing files does not execute any test.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Verify every graph test file is assigned to a shard
        run: bash scripts/run-graph-bats.sh --list-files >/dev/null

  python:
    name: Python unit tests (quarantined)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Python unit tests
        id: pythontests
        continue-on-error: true
        run: bash scripts/run-python-unit-tests.sh -v

      - name: Report Python quarantine status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pythontests.outcome }}
        run: |
          if [[ "$TEST_OUTCOME" == "failure" ]]; then
            echo "::warning::Python unit tests failed but are temporarily quarantined."
            {
              echo "### Python unit tests (quarantined)"
              echo "The Python suite failed but did not block this workflow. Review the test step logs before merging."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Python unit tests (quarantined)"
              echo "The Python suite completed with outcome: $TEST_OUTCOME."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  process-lifecycle:
    name: Process lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Signal/teardown tests spawn supervised children; a missed reap is exactly
    # the failure mode that would otherwise hang the runner. macOS minutes bill
    # at 10x, so an uncapped hang here is the most expensive one in the repo.
    timeout-minutes: 20
    # The process-supervisor suite is portable and remains blocking on both OSes.
    # The orchestration fixture below depends on process-group/session behavior
    # that is stable on Linux but does not start reliably on macOS runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run blocking process lifecycle tests
        run: >-
          bin/bats -T
          tests/bats/run-plan/run-plan-process-supervisor.bats

      - name: Run Linux orchestration TERM teardown tests
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          bin/bats -T tests/bats/orchestrator/orchestrator.bats
          --filter 'orchestrator teardown stops .* on SIGTERM'
