name: Bats tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  bats:
    name: Run Bats harness
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GNU parallel and ripgrep
        run: sudo apt-get update && sudo apt-get install -y parallel ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Bats suite
        run: CI=1 bash scripts/run-bats.sh -j 4

      - name: Recheck resource-sensitive Bats tests serially
        # These tests fork many short-lived jq/flock/awk/mktemp subprocesses per
        # invocation. On a loaded runner right after the -j 4 suite, a single
        # transient subprocess failure makes the native-hook fail-open (empty
        # output) or drops a dedupe cache write, producing a spurious red. They
        # pass deterministically in isolation, so retry the whole serial batch a
        # few times and only fail the job if every attempt fails. This retries
        # transient flake; it does not skip or weaken the assertions.
        env:
          CI: '1'
          RALPH_CI_SERIAL_RECHECK: '1'
        run: |
          set -uo pipefail
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::serial recheck attempt ${attempt}/${attempts}"
            # Recreate the small shared fixture set before each attempt. The
            # parallel suite may legitimately update fixture state, and a
            # retry must start from the same clean inputs rather than replaying
            # against a failed attempt's leftovers.
            bash scripts/setup-test-fixtures.sh
            if bash scripts/run-bats.sh -j 1 -- \
              --print-output-on-failure \
              tests/bats/mcp-proxy/mcp-proxy-grep-source-cap-dedupe.bats \
              tests/bats/native-hook/bash-compact-delivered-metrics.bats \
              tests/bats/native-hook/fail-open-instrumentation.bats \
              tests/bats/native-hook/native-result-shapes.bats; then
              echo "::endgroup::"
              echo "serial recheck passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "serial recheck attempt ${attempt} failed"
          done
          echo "serial recheck failed after ${attempts} attempts" >&2
          exit 1

  python:
    name: Python unit tests (quarantined)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Generate test fixtures for .ralph-workspace/
        run: bash scripts/setup-test-fixtures.sh

      - name: Run Python unit tests
        id: pythontests
        continue-on-error: true
        run: bash scripts/run-python-unit-tests.sh -v

      - name: Report Python quarantine status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pythontests.outcome }}
        run: |
          if [[ "$TEST_OUTCOME" == "failure" ]]; then
            echo "::warning::Python unit tests failed but are temporarily quarantined."
            {
              echo "### Python unit tests (quarantined)"
              echo "The Python suite failed but did not block this workflow. Review the test step logs before merging."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Python unit tests (quarantined)"
              echo "The Python suite completed with outcome: $TEST_OUTCOME."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  process-lifecycle:
    name: Process lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The process-supervisor suite is portable and remains blocking on both OSes.
    # The orchestration fixture below depends on process-group/session behavior
    # that is stable on Linux but does not start reliably on macOS runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Link shared Ralph scripts from bundle
        run: ln -sfn bundle/.ralph .ralph

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run blocking process lifecycle tests
        run: >-
          bin/bats -T
          tests/bats/run-plan/run-plan-process-supervisor.bats

      - name: Run Linux orchestration TERM teardown tests
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          bin/bats -T tests/bats/orchestrator/orchestrator.bats
          --filter 'orchestrator teardown stops .* on SIGTERM'
