name: Ralph Dashboard Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ralph-dashboard/**'
      - '.github/workflows/ralph-dashboard-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ralph-dashboard/**'
      - '.github/workflows/ralph-dashboard-tests.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (22.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ralph-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: ralph-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server tests with coverage
        id: servertests
        continue-on-error: true
        run: npm run test:cov:server -- --maxWorkers=2

      - name: Run Angular tests with coverage
        id: angulartests
        continue-on-error: true
        run: npm run test:cov:angular -- --maxWorkers=2

      - name: Report dashboard quarantine status
        if: always()
        env:
          SERVER_OUTCOME: ${{ steps.servertests.outcome }}
          ANGULAR_OUTCOME: ${{ steps.angulartests.outcome }}
        run: |
          {
            echo "### Dashboard tests (quarantined)"
            echo "- Server coverage: $SERVER_OUTCOME"
            echo "- Angular coverage: $ANGULAR_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SERVER_OUTCOME" == "failure" ]]; then
            echo "::warning::Dashboard server tests failed but are temporarily quarantined."
          fi
          if [[ "$ANGULAR_OUTCOME" == "failure" ]]; then
            echo "::warning::Dashboard Angular tests failed but are temporarily quarantined."
          fi
