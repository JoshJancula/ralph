name: Ralph plugin authenticated smoke (Claude)

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RALPH_PLUGIN_DIR: plugins/ralph-orchestrator/claude
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require authenticated smoke secret
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          echo "::add-mask::$ANTHROPIC_API_KEY"

      - name: Install Claude Code and repository plugin
        run: |
          set -euo pipefail
          if [[ "${RALPH_SMOKE_MOCK:-0}" == "1" ]]; then
            echo 'mock: claude plugin install'
            exit 0
          fi
          npm install --global @anthropic-ai/claude-code
          claude plugin marketplace add "$GITHUB_WORKSPACE/$RALPH_PLUGIN_DIR"
          claude plugin install ralph-orchestrator@ralph-plugins

      - name: Smoke discovery
        run: |
          set -euo pipefail
          if [[ "${RALPH_SMOKE_MOCK:-0}" == "1" ]]; then
            echo 'mock: claude plugin list'
          else
            claude plugin list
          fi

      - name: Smoke read-only doctor
        run: |
          set -euo pipefail
          if [[ "${RALPH_SMOKE_MOCK:-0}" == "1" ]]; then
            echo 'mock: /ralph-doctor'
          else
            claude -p '/ralph-doctor' --output-format text
          fi

      - name: Smoke safe workflow
        run: |
          set -euo pipefail
          if [[ "${RALPH_SMOKE_MOCK:-0}" == "1" ]]; then
            echo 'mock: /ralph-agents'
          else
            claude -p '/ralph-agents' --output-format text
          fi

      - name: Uninstall repository plugin
        if: always()
        run: |
          set -euo pipefail
          if [[ "${RALPH_SMOKE_MOCK:-0}" == "1" ]]; then
            echo 'mock: claude plugin uninstall'
          else
            claude plugin uninstall ralph-orchestrator@ralph-plugins
            claude plugin marketplace remove ralph-plugins
          fi
